[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-irrigation-agent"
version = "1.0.0"
description = "Precision irrigation RL agent for Punjab rice farming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0",
  "gradio==6.11.0",
  "audioop-lts; python_version >= '3.13'",
  "openenv-core>=0.2.0",
  "openai",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "requests>=2.25.0",
]

[project.scripts]
server = "server.app:main"
