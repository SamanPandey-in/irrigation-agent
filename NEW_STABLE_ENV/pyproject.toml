[project]
name = "punjab-precision-irrigation"
version = "1.0.0"
description = "OpenEnv Punjab precision irrigation environment"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "openenv-core>=0.2.0",
  "requests",
  "streamlit",
  "openai",
  "gymnasium",
  "numpy",
  "torch",
  "matplotlib",
  "python-multipart",
  "pytest",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "gym_env", "data"]
