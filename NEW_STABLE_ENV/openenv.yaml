  - name: hard
    description: >
      90-day dry season (April–June): heat, drought and frequent 6–14hr power cuts.
      Target: crop_growth ≥ 65%, water_efficiency > 1.2x baseline. Reserve: 2000L.
    seed: 13
    max_steps: 90
    difficulty: hard
    grader: "server.graders:grade_task"
  - name: hard_1
    description: >
      90-day dry season (April–June): heat, drought and frequent 6–14hr power cuts.
      Target: crop_growth ≥ 65%, water_efficiency > 1.2x baseline. Reserve: 2000L.
    seed: 113
    max_steps: 90
    difficulty: hard
