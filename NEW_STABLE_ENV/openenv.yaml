name: punjab-precision-irrigation
version: "1.0"
description: >
  Punjab Rice Farm Precision Irrigation Environment.
  An RL agent optimises daily irrigation decisions across a kharif rice-paddy
  growing season (30–90 days) under stochastic monsoon, drought and power-cut
  dynamics — tackling India's 40% groundwater overuse crisis.
  Agent observes soil moisture, crop growth, 3-day IMD weather forecast,
  water reserve and power status; takes discrete irrigation actions.

author: Saman

benchmark: punjab-precision-irrigation

server:
  host: "0.0.0.0"
  port: 7860
  start_command: "python -m uvicorn server.app:app --host 0.0.0.0 --port 7860"

tasks:
  - name: easy
    description: >
      30-day kharif season starting July (peak monsoon). Ample rainfall, no power cuts.
      Target: crop_growth ≥ 70% without over-irrigating. Water reserve: 5000L.
    seed: 42
    max_steps: 30
    difficulty: easy
    grader: "server.graders:grade_task"
  - name: easy_1
    description: >
      30-day kharif season starting July (peak monsoon). Ample rainfall, no power cuts.
      Target: crop_growth ≥ 70% without over-irrigating. Water reserve: 5000L.
    seed: 142
    max_steps: 30
    difficulty: easy
    grader: "server.graders:grade_task"
  - name: easy_2
    description: >
      30-day kharif season starting July (peak monsoon). Ample rainfall, no power cuts.
      Target: crop_growth ≥ 70% without over-irrigating. Water reserve: 5000L.
    seed: 242
    max_steps: 30
    difficulty: easy
    grader: "server.graders:grade_task"
  - name: easy_3
    description: >
      30-day kharif season starting July (peak monsoon). Ample rainfall, no power cuts.
      Target: crop_growth ≥ 70% without over-irrigating. Water reserve: 5000L.
    seed: 342
    max_steps: 30
    difficulty: easy
    grader: "server.graders:grade_task"

  - name: medium
    description: >
      60-day season (June–July), pre-monsoon onset + occasional power cuts.
      Target: crop_growth ≥ 72%, water_efficiency > 1.0x baseline. Reserve: 3500L.
    seed: 7
    max_steps: 60
    difficulty: medium
    grader: "server.graders:grade_task"
  - name: medium_1
    description: >
      60-day season (June–July), pre-monsoon onset + occasional power cuts.
      Target: crop_growth ≥ 72%, water_efficiency > 1.0x baseline. Reserve: 3500L.
    seed: 17
    max_steps: 60
    difficulty: medium
    grader: "server.graders:grade_task"
  - name: medium_2
    description: >
      60-day season (June–July), pre-monsoon onset + occasional power cuts.
      Target: crop_growth ≥ 72%, water_efficiency > 1.0x baseline. Reserve: 3500L.
    seed: 27
    max_steps: 60
    difficulty: medium
    grader: "server.graders:grade_task"
  - name: medium_3
    description: >
      60-day season (June–July), pre-monsoon onset + occasional power cuts.
      Target: crop_growth ≥ 72%, water_efficiency > 1.0x baseline. Reserve: 3500L.
    seed: 37
