action_space:
  type: Discrete
  n: 5
  labels:
    - "0: no_water"
    - "1: low_50L (10% pump capacity)"
    - "2: medium_150L (30% pump capacity)"
    - "3: high_250L (50% pump capacity)"
    - "4: drain_excess"

observation_space:
  type: Dict
  fields:
    day:                    "int — current day"
    total_days:             "int — episode length"
    soil_moisture:          "float [0,1] — fraction of field capacity"
    crop_growth:            "float [0,1] — yield potential realised"
    water_reserve:          "float — litres remaining in tube-well tank"
    power_status:           "int 0|1 — 1=grid on, 0=power cut"
    current_rain_mm:        "float — rainfall today in mm"
    current_temp_celsius:   "float — temperature today in celsius"
    weather_forecast:       "list[3] — rain_mm, temp_celsius, humidity, power_cut_risk per day"
    season:                 "str — pre_monsoon|monsoon|post_monsoon|rabi"
    cumulative_water_used:  "float — total litres pumped so far"
    stress_days:            "int — days with crop moisture stress"
    last_action_result:     "str — outcome of last irrigation action"
    water_efficiency_index: "float — yield/water vs baseline (>1.2 is target)"
    echoed_message:         "str — full natural-language state for LLM agents"

reward:
  formula: "yield_bonus - water_cost - stress_penalty [+ terminal_bonus]"
  components:
    yield_bonus:     "growth_delta × 1000"
    water_cost:      "litres_used × 0.1"
    stress_penalty:  "50.0 per day with severe moisture stress"
    terminal_bonus:  "crop_growth × 1000 at episode end"
  min: -500.0
  max: 1300.0

score:
  min: 0.0
  max: 1.0
  components:
    yield_achievement:   "60% — crop_growth vs task target"
    water_efficiency:    "20% — efficiency index vs 1.2x baseline"
    stress_free_days:    "10% — fraction of days without stress"
    water_conservation:  "10% — water used vs budget"
