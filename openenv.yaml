name: precision-irrigation-agent
version: 1.0.0
description: Precision irrigation RL agent for Punjab rice farming.
entrypoint: python app.py
inference: inference.py
observation_space:
  type: dict
  properties:
    soil_moisture_obs: { type: box, low: 0, high: 1, shape: [1] }
    crop_growth: { type: box, low: 0, high: 1, shape: [1] }
    crop_stage: { type: discrete, n: 4 }
    weather_forecast: { type: box, low: 0, high: 100, shape: [3, 2] }
    water_tank: { type: box, low: 0, high: 1, shape: [1] }
    power_status: { type: discrete, n: 2 }
    day_of_season: { type: discrete, n: 91 }
    grid_moisture: { type: box, low: 0, high: 1, shape: [4, 4] }

action_space:
  type: discrete
  n: 5
  labels:
    0: No Water
    1: Low (1kL)
    2: Medium (3kL)
    3: High (5kL)
    4: Drain

tasks:
  - id: task_1
    name: Normal Season
    description: Standard Punjab weather patterns. Agent must maintain soil moisture in the optimal band across the full 90-day Kharif rice season.
    grader: evaluator.programmatic_grader.ProgrammaticGrader
    config: { preset: "Normal" }
  - id: task_2
    name: Drought Challenge
    description: Low rainfall and high heat. Agent must conserve tank water while preventing crop stress.
    grader: evaluator.programmatic_grader.ProgrammaticGrader
    config: { preset: "Drought" }
  - id: task_3
    name: Compounded Adversity (Hard)
    description: Extreme drought, frequent power cuts, narrow moisture band, flash floods. Expected score 0.10-0.18.
    grader: evaluator.programmatic_grader.ProgrammaticGrader
    config: { preset: "Hard Mode" }
